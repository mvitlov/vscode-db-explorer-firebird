<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src vscode-resource: https: data:; script-src vscode-resource: 'unsafe-inline'; style-src 'unsafe-inline' vscode-resource:; font-src vscode-resource: data:;"
    />
    <link type="text/css" rel="stylesheet" href="/css/loader.css" media="screen,projection" />
    <link type="text/css" rel="stylesheet" href="/css/ag-grid.min.css" media="screen,projection" />
    <link type="text/css" rel="stylesheet" href="/css/ag-theme-balham.min.css" media="screen,projection" />
    <link type="text/css" rel="stylesheet" href="/css/app.css" media="screen,projection" />
    <title>Firebird Query Results</title>
  </head>

  <body>
    <div id="loader-wrapper">
      <div id="loader"></div>
      <div class="loader-section section-left"></div>
      <div class="loader-section section-right"></div>
    </div>

    <div id="content" class="results-shell">
      <header class="results-header">
        <div>
          <h1 id="panel-title">Result grid</h1>
          <p id="panel-subtitle" class="panel-subtitle">Run a query to inspect rows here.</p>
        </div>
        <div id="query-stats" class="stats-grid"></div>
      </header>

      <section id="sql-strip" class="sql-strip" hidden>
        <div class="sql-strip-label">SQL</div>
        <div id="sql-preview" class="sql-preview"></div>
        <button id="copy-sql" class="copy-sql-icon" type="button" title="Copy SQL">📋</button>
      </section>

      <section id="empty-state" class="empty-state" hidden>
        <h2>No rows to display</h2>
        <p>The command ran, but no records were returned for the current result set.</p>
      </section>

      <section id="table-shell" class="table-shell" hidden>
        <div id="ag-grid-container" class="ag-theme-custom" style="height: 100%; width: 100%;"></div>
      </section>

      <div class="table-footer">
        <div id="csv-actions" class="csv-actions"></div>
      </div>
    </div>

    <script type="text/javascript" src="/js/ag-grid-community.min.js"></script>
    <script type="text/javascript" src="/js/app.js"></script>
  </body>
</html>
